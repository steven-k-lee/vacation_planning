<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolomites Family Packing Checklist</title>
    <style>
        body { font-family: -apple-system, sans-serif; line-height: 1.5; margin: 0; padding: 0; background-color: #f4f6f8; color: #333; }
        .header { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); color: white; text-align: center; padding: 20px 10px; }
        .header h1 { margin: 0; font-size: 20px; }
        .container { max-width: 480px; margin: 0 auto; padding: 12px; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 3px 8px rgba(0,0,0,0.04); }
        .title { color: #1e3c72; margin-top: 0; border-bottom: 2px solid #f4f6f8; padding-bottom: 6px; font-size: 15px; font-weight: bold; text-transform: uppercase; }
        .item { display: flex; align-items: flex-start; margin-bottom: 10px; font-size: 13px; cursor: pointer; }
        .item input { margin-right: 10px; margin-top: 3px; transform: scale(1.1); }
        .item input:checked + span { text-decoration: line-through; color: #888; }
        .desc { font-size: 11px; color: #666; display: block; margin-top: 2px; }
        .btn-reset { display: block; width: 100%; background: #333; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h1>🎒 Dolomites Packing Checklist</h1>
    <p>Autumn Road Trip | Family of 5 Interactive App</p>
</div>

<div class="container">

    <!-- CLOTHING -->
    <div class="card">
        <div class="title">🧥 Autumn Mountain Clothing (Valley 8°C-15°C / Peaks 0°C)</div>
        <label class="item"><input type="checkbox"><span><strong>Thermal Base Layers</strong><span class="desc">Moisture-wicking tops and bottoms for the chilly mornings on Alpe di Siusi.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Fleece or Puffer Jackets</strong><span class="desc">Essential insulation layers for every family member. It gets windy at 2,500m!</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Wind & Rainproof Shell Jackets</strong><span class="desc">To stay protected against unexpected October mountain drizzle or wind gusts.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Beanies & Warm Gloves</strong><span class="desc">Crucial for early mornings and high-altitude viewpoints like Seceda.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Sturdy Walking Shoes / Sneakers</strong><span class="desc">Must have robust grip for smooth, wide gravel trails (no technical hiking boots required).</span></span></label>
    </div>

    <!-- ELECTRONICS -->
    <div class="card">
        <div class="title">🔌 Teenagers & Car Electronics</div>
        <label class="item"><input type="checkbox"><span><strong>Long Smartphone Charging Cables</strong><span class="desc">Keep all three teenagers' devices powered in the back seats during the 7-hour drives.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Portable Power Banks</strong><span class="desc">Crucial to keep phones alive for photo taking on the extended e-bike and boat day.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Offline Playlists & Audiobooks</strong><span class="desc">Download media ahead of time; mountain passes often have dead cellular zones.</span></span></label>
    </div>

    <!-- DOCUMENTS -->
    <div class="card">
        <div class="title">📋 Mandatory Car Gear & Documents</div>
        <label class="item"><input type="checkbox"><span><strong>5x Reflective Safety Vests</strong><span class="desc">Must be stored inside the cabin, not in the trunk (Legal requirement for AT/IT).</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Warning Triangle & Medical Kit</strong><span class="desc">Double-check that your car's first aid kit is completely unexpired.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Austrian Vignette & Brenner Toll</strong><span class="desc">Keep digital confirmations or stickers ready for the highway pass crossings.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Tre Cime Online Entry Voucher</strong><span class="desc">Have the pass.auronzo.info toll barcode downloaded on your smartphone.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Hotel Reservations</strong><span class="desc">Digital or printed slips for Villa Fantasia, Cesa Sassela, and Hotel Heidi.</span></span></label>
    </div>

    <!-- PICKY EATER SNACKS -->
    <div class="card">
        <div class="title">🥨 Vegetable-Free Car Snacks</div>
        <label class="item"><input type="checkbox"><span><strong>Dry Car Snacks</strong><span class="desc">Pretzels, plain chips, crackers, and popcorn to minimize hanger tantrums.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Meat & Cheese Fuel</strong><span class="desc">Salami sticks, jerky, and individual cheese wheels for your vegetable-hating teens.</span></span></label>
        <label class="item"><input type="checkbox"><span><strong>Bottled Water & Juice Boxes</strong><span class="desc">Pack a cooler in the trunk to stay hydrated without paying high pass station prices.</span></span></label>
    </div>

    <button class="btn-reset" onclick="document.querySelectorAll('input').forEach(i=>i.checked=false)">🔄 Clear Checklist / Reset All</button>

</div>

</body>
</html>
